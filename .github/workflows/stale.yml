name: Record da verificare
on:
  schedule:
    - cron: '17 6 1 * *' # il primo di ogni mese
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Elenco record scaduti
        run: npx tsx scripts/stale.ts --md > stale.md
      - name: Apri o aggiorna la issue
        if: hashFiles('stale.md') != '' 
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('stale.md', 'utf8').trim();
            if (!body) return;
            const title = 'Record CRAS da verificare';
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'dati-stale', per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['dati-stale'] });
            }
